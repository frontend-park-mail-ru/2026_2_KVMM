<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnlineConf</title>
  </head>
  <body>
    <header class="onlineconf__header">
      <div class="onlineconf__container">
        <a class="onlineconf__home" href="/">Nexly</a>
      </div>
    </header>

    <main class="onlineconf__container onlineconf__main">
      <h1 class="onlineconf__title">OnlineConf</h1>
      <p class="onlineconf__description">Настройки и фича-флаги Nexly</p>

      <nav class="onlineconf__navigation" aria-label="Разделы OnlineConf">
        <button id="onlineconf-show-keys" class="onlineconf__button" type="button" aria-controls="onlineconf-keys" aria-pressed="true">Ключи</button>
        <button id="onlineconf-show-admins" class="onlineconf__button" type="button" aria-controls="onlineconf-admins" aria-pressed="false">Администраторы</button>
      </nav>

      <div id="onlineconf-keys" class="onlineconf__workspace">
        <section class="onlineconf__panel" aria-labelledby="onlineconf-keys-title">
          <div class="onlineconf__panel-header">
            <h2 id="onlineconf-keys-title" class="onlineconf__section-title">Ключи</h2>
            <button id="onlineconf-create" class="onlineconf__button onlineconf__button_primary" type="button" hidden>
              Создать ключ
            </button>
          </div>
          <form id="onlineconf-filters" class="onlineconf__filters" role="search" hidden>
            <label class="onlineconf__field">
              Поиск по имени
              <input name="q" type="search" placeholder="Например, likes" />
            </label>
            <label class="onlineconf__field">
              Скоуп
              <select name="scope">
                <option value="">Все скоупы</option>
                <option value="frontend">frontend</option>
                <option value="auth">auth</option>
                <option value="user">user</option>
                <option value="posts">posts</option>
                <option value="community">community</option>
                <option value="backend">backend</option>
              </select>
            </label>
          </form>

          <table id="onlineconf-entries" class="onlineconf__table" aria-labelledby="onlineconf-keys-title" hidden>
            <thead>
              <tr>
                <th scope="col">Ключ</th>
                <th scope="col">Скоуп</th>
                <th scope="col">Тип</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="onlineconf-status" class="onlineconf__status" role="status">Загружаем ключи…</p>
          <button id="onlineconf-retry" class="onlineconf__button" type="button" hidden>
            Повторить загрузку
          </button>
        </section>

        <section id="onlineconf-editor" class="onlineconf__panel" aria-labelledby="onlineconf-editor-title" hidden>
          <h2 id="onlineconf-editor-title" class="onlineconf__section-title">Новый ключ</h2>
          <form class="onlineconf__editor-form" novalidate>
            <label class="onlineconf__field">
              Скоуп
              <select name="scope" aria-describedby="onlineconf-scope-error" required>
                <option value="">Выберите скоуп</option>
                <option value="frontend">frontend</option>
                <option value="auth">auth</option>
                <option value="user">user</option>
                <option value="posts">posts</option>
                <option value="community">community</option>
                <option value="backend">backend</option>
              </select>
              <span id="onlineconf-scope-error" class="onlineconf__field-error" role="alert" hidden></span>
            </label>
            <label class="onlineconf__field">
              Имя ключа
              <input name="name" type="text" placeholder="Например, max_text_length" autocomplete="off" aria-describedby="onlineconf-name-error" required />
              <span id="onlineconf-name-error" class="onlineconf__field-error" role="alert" hidden></span>
            </label>
            <label class="onlineconf__field">
              Тип
              <select name="kind">
                <option value="config">Конфиг</option>
                <option value="flag">Фича-флаг</option>
              </select>
            </label>
            <div id="onlineconf-config-fields" class="onlineconf__field-group">
              <label class="onlineconf__field">
                Значение JSON
                <textarea name="value" class="onlineconf__code-input" rows="5" spellcheck="false" placeholder="Например, 50" aria-describedby="onlineconf-value-error"></textarea>
                <span id="onlineconf-value-error" class="onlineconf__field-error" role="alert" hidden></span>
              </label>
            </div>
            <div id="onlineconf-flag-fields" class="onlineconf__field-group" hidden>
              <label class="onlineconf__field">
                Процент раскатки
                <input name="rollout" type="number" min="0" max="100" step="1" value="0" aria-describedby="onlineconf-rollout-error" />
                <span id="onlineconf-rollout-error" class="onlineconf__field-error" role="alert" hidden></span>
              </label>
              <label class="onlineconf__field">
                Принудительное включение
                <textarea name="include" class="onlineconf__code-input" rows="2" spellcheck="false" placeholder="Один UUID на строку" aria-describedby="onlineconf-include-error onlineconf-override-conflict"></textarea>
                <span id="onlineconf-include-error" class="onlineconf__field-error" role="alert" hidden></span>
              </label>
              <label class="onlineconf__field">
                Принудительное исключение
                <textarea name="exclude" class="onlineconf__code-input" rows="2" spellcheck="false" placeholder="Один UUID на строку" aria-describedby="onlineconf-exclude-error onlineconf-override-conflict"></textarea>
                <span id="onlineconf-exclude-error" class="onlineconf__field-error" role="alert" hidden></span>
              </label>
              <p id="onlineconf-override-conflict" class="onlineconf__editor-error" role="alert" hidden></p>
            </div>
            <p id="onlineconf-editor-error" class="onlineconf__editor-error" role="alert" hidden></p>
            <div class="onlineconf__editor-actions">
              <button id="onlineconf-cancel" class="onlineconf__button" type="button">Отмена</button>
              <button class="onlineconf__button onlineconf__button_primary" type="submit">Сохранить</button>
            </div>
          </form>
        </section>
      </div>

      <section id="onlineconf-admins" class="onlineconf__panel onlineconf__admins" aria-labelledby="onlineconf-admins-title" hidden>
        <h2 id="onlineconf-admins-title" class="onlineconf__section-title">Администраторы</h2>
        <form class="onlineconf__admin-form" novalidate>
          <label class="onlineconf__field">
            UUID пользователя Nexly
            <input name="profile_uid" class="onlineconf__code-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="onlineconf-admin-uid-error" required />
            <span id="onlineconf-admin-uid-error" class="onlineconf__field-error" role="alert" hidden></span>
          </label>
          <button class="onlineconf__button onlineconf__button_primary" type="submit">Выдать доступ</button>
        </form>
        <p id="onlineconf-admin-error" class="onlineconf__editor-error" role="alert" hidden></p>
        <p id="onlineconf-admin-feedback" class="onlineconf__admin-feedback" role="status" hidden></p>
        <p id="onlineconf-admins-status" class="onlineconf__status" role="status" hidden></p>
        <button id="onlineconf-admins-retry" class="onlineconf__button" type="button" hidden>Повторить загрузку</button>
        <ul id="onlineconf-admins-list" class="onlineconf__admin-list" aria-label="Список администраторов" hidden></ul>
      </section>
    </main>
  </body>
</html>
